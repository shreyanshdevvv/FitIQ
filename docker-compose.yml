services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitcoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitcoach_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fitcoach_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitcoach} -d ${POSTGRES_DB:-fitcoach_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
